<!--
background :
- backgroung-color : mengatur warna backgorund
- background-image : mengatur gambar yg akan digunakan pada background
- background-position : mengatur posisi gambar
- background-repeat : mengatur jenis pengulangan gambar pada background 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background css</title>
    <style>
        /* 
        background-repeat :
        - repeat
        - repeat-x
        - repeat-y
        - no-repeat

        background-position :
        - top (atas) : left, right, center
        - center (tengah): left, right, center
        - bonttom (bawah): left, right, center  
        - x%
        - y%
        - x-pos & y-pos 
        
        css background ( shorthand) :
        background : color url() position repeat;
        contoh : 
        background: blue url(bg.png) top left no-repeat;
        */
        body {
            background-color: #e7f4fa;
            background-image: url(../latihan4/img/background2.jpg);
            background-repeat: repeat-x;
            /* background-position: bottom right; */

        }
    </style>
</head>
<body>
    <h1>hello world</h1>
</body>
</html>
