<!-- anatomi css
selector { property : value; }

menempatkan css:
- embed :
css menggunakan tag <style></style>

- inline :
style pada html

- external :
menggunakan link agar dapat digunakan di halaman terpisah
<link rel="stylesheet" href="style.css">
selector itu dapat berupa tag html atau bisa 
mengunakan berdasarkan class/id
contoh : 
h1 { color : blue; } -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>embed css</title>
    <style>
        h1 {
            color: lightblue;
            font-family: arial;
        }

        p {
            color: white;
        }
    </style>
</head>
<body>
    <h1>hello world</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. 
        Nostrum quaerat natus quia distinctio aliquid voluptates nisi aliquam a. 
        Officiis quis odit molestias odio accusamus facilis, laboriosam natus neque perspiciatis aspernatur.</p>
</body>
</html>
